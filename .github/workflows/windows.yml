name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Vendored engines, pinned + checksum-verified ─────────────────────
      - name: Vendor cores (xray + sing-box + wintun + aether)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-windows-64.zip" -OutFile xray.zip
          $h = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "fc58c39ee2f2717b4c54d28d374362389e5319b20ae44aea76ea45a5243ec827") { throw "xray zip checksum mismatch: $h" }
          Expand-Archive xray.zip -DestinationPath xraysrc

          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile sb.zip
          $h = (Get-FileHash sb.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df") { throw "sing-box zip checksum mismatch: $h" }
          Expand-Archive sb.zip -DestinationPath sbsrc

          # The phone's OWN engine (core/aether, same 2.3.0 the Android jniLibs
          # build carries) as the standalone Windows binary upstream ships —
          # plus the pluggable transports it can drive (lyrebird,
          # psiphon-tunnel-core). Checksum-pinned like every other core.
          Invoke-WebRequest -Uri "https://github.com/CluvexStudio/aether/releases/download/v2.3.0/aether-windows-x86_64.zip" -OutFile aether.zip
          $h = (Get-FileHash aether.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "0cc32dd2d7573f91d2e55d4f427bfe4c6f6252342494e1b410d61b12d1e4dc79") { throw "aether zip checksum mismatch: $h" }
          Expand-Archive aether.zip -DestinationPath aethersrc

          # Cores go under windows/cores-bin/cores/ — a Gradle resources srcDir —
          # so they end up INSIDE the app jar; the app extracts them on first
          # connect. This ships with both the MSI and the portable zip.
          New-Item -ItemType Directory -Force -Path windows/cores-bin/cores | Out-Null
          $dst = "windows/cores-bin/cores"
          Copy-Item xraysrc/xray.exe    $dst/
          Copy-Item xraysrc/geoip.dat   $dst/
          Copy-Item xraysrc/geosite.dat $dst/
          Copy-Item xraysrc/wintun.dll  $dst/
          Copy-Item sbsrc/sing-box-1.14.4-windows-amd64/sing-box.exe $dst/
          Copy-Item aethersrc/aether.exe $dst/
          # PT binaries ride flat next to the engines — the app passes their
          # paths to the core explicitly (AETHER_TOR_PT / AETHER_PSIPHON_BIN).
          Copy-Item aethersrc/pt/lyrebird.exe $dst/
          Copy-Item aethersrc/pt/psiphon-tunnel-core.exe $dst/
          # size manifest the app uses to detect partial/stale extractions
          Get-ChildItem $dst | Where-Object { $_.Name -ne "manifest.txt" } |
            ForEach-Object { "$($_.Name):$($_.Length)" } | Set-Content "$dst/manifest.txt"
          Get-Content "$dst/manifest.txt"
          Get-ChildItem $dst | Format-Table Name, Length

      - name: "Resolve the app version (single source: build.gradle.kts)"
        shell: pwsh
        run: |
          $line = Select-String -Path windows/build.gradle.kts -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $line) { throw "cannot read the app version from windows/build.gradle.kts" }
          $ver = $line.Matches[0].Groups[1].Value
          "APP_VER=$ver" >> $env:GITHUB_ENV
          Write-Host "app version: $ver"

      # The config env rides the TEST step too: generateBeeConfig bakes the
      # values into the generated sources, and a task run without them first
      # would poison the build step's regeneration history.
      - name: Unit tests (the license & shard QA gate)
        working-directory: windows
        env:
          BEE_LICENSE_URL: ${{ secrets.BEE_LICENSE_URL }}
          BEE_LICENSE_PUBKEY_B64: ${{ secrets.BEE_LICENSE_PUBKEY_B64 }}
          BEE_TELEGRAM_URL: ${{ secrets.BEE_TELEGRAM_URL }}
          BEE_SUPPORT_URL: ${{ secrets.BEE_SUPPORT_URL }}
          BEE_IDENTITY_RELAY_HMAC: ${{ secrets.BEE_IDENTITY_RELAY_HMAC }}
        run: .\gradlew.bat test --no-daemon

      - name: Build (MSI + distributable app image)
        shell: pwsh
        working-directory: windows
        env:
          BEE_LICENSE_URL: ${{ secrets.BEE_LICENSE_URL }}
          BEE_LICENSE_PUBKEY_B64: ${{ secrets.BEE_LICENSE_PUBKEY_B64 }}
          BEE_TELEGRAM_URL: ${{ secrets.BEE_TELEGRAM_URL }}
          BEE_SUPPORT_URL: ${{ secrets.BEE_SUPPORT_URL }}
          BEE_IDENTITY_RELAY_HMAC: ${{ secrets.BEE_IDENTITY_RELAY_HMAC }}
        run: |
          .\gradlew.bat packageMsi createDistributable --no-daemon

      # ── Guard: the bundled runtime must actually carry java.net.http ────
      # The 1.5.0 MSI shipped a trimmed runtime without it, and the license
      # gate died with «Could not initialize class: LicenseAPI». This step
      # makes that packaging gap a hard CI failure, not a buyer's bug report.
      - name: Guard — runtime image must contain java.net.http + crypto
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = "windows/build/compose/binaries/main/app/BEE-VPN"
          # 1) the jpackage runtime must carry the JDK modules the app needs
          $modules = "$appDir/runtime/lib/modules"
          if (-not (Test-Path $modules)) { throw "runtime image not found at $modules" }
          $list = & jimage list "$modules"
          $requiredRuntime = @(
            "java/net/http/HttpClient.class",
            "java/net/http/HttpResponse.class",
            "sun/security/ec/SunEC.class"
          )
          $missing = @()
          foreach ($c in $requiredRuntime) {
            if (-not ($list | Select-String -SimpleMatch "/$c")) { $missing += $c }
          }
          # 2) the app jar must carry the gate classes and the brand logo
          $jar = Get-ChildItem "$appDir/app" -Filter "*.jar" |
            Where-Object { (& jar tf $_.FullName | Select-String -SimpleMatch "com/beevpn/win/MainKt.class") } |
            Select-Object -First 1
          if (-not $jar) { throw "main app jar not found under $appDir/app" }
          $jarList = & jar tf $jar.FullName
          foreach ($c in @("com/beevpn/win/license/LicenseAPI.class", "beevpn-logo.png")) {
            if (-not ($jarList | Select-String -SimpleMatch $c)) { $missing += $c }
          }
          if ($missing.Count -gt 0) {
            throw "packaging gap — missing: $($missing -join ', ') (the license gate would crash)"
          }
          Write-Host "packaging OK: java.net.http + SunEC in the runtime, LicenseAPI + logo in the app jar"

      # ── Portable zip: the self-contained app image + launcher ────────────
      - name: Assemble portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "windows/build/compose/binaries/main/app/BEE-VPN"
          Get-ChildItem $app | Format-Table Name, Length
          # cores ride INSIDE the app jars (extracted on first connect) —
          # scan every jar: the main jar is content-hashed, not a fixed name.
          $foundXray = $false
          $foundAether = $false
          Get-ChildItem "$app/app" -Filter "*.jar" | ForEach-Object {
            if (-not $foundXray) {
              $hits = jar tf $_.FullName | Select-String "cores/xray.exe"
              if ($hits) { $foundXray = $true; Write-Host "cores present in $($_.Name)" }
            }
            if (-not $foundAether) {
              $hits = jar tf $_.FullName | Select-String "cores/aether.exe"
              if ($hits) { $foundAether = $true; Write-Host "aether present in $($_.Name)" }
            }
          }
          if (-not $foundXray) { throw "cores did not land inside the app jar" }
          if (-not $foundAether) { throw "aether.exe did not land inside the app jar" }
          Copy-Item windows/BEE-VPN.bat "$app/BEE-VPN.bat"
          Copy-Item windows/README-FA.txt "$app/README-FA.txt"
          Compress-Archive -Path $app -DestinationPath "BEE-VPN-$env:APP_VER-portable-x64.zip"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: BEE-VPN-${{ env.APP_VER }}-msi-x64
          path: windows/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: BEE-VPN-${{ env.APP_VER }}-portable-x64
          path: BEE-VPN-${{ env.APP_VER }}-portable-x64.zip
          if-no-files-found: error

      # Tag builds land on the GitHub Release next to the signed APKs
      # (release.yml) — one release, all three platforms.
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/build/compose/binaries/main/msi/*.msi
            BEE-VPN-${{ env.APP_VER }}-portable-x64.zip
