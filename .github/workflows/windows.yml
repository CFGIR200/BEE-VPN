name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Vendored engines, pinned + checksum-verified ─────────────────────
      - name: Vendor cores (xray + sing-box + wintun)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-windows-64.zip" -OutFile xray.zip
          $h = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "fc58c39ee2f2717b4c54d28d374362389e5319b20ae44aea76ea45a5243ec827") { throw "xray zip checksum mismatch: $h" }
          Expand-Archive xray.zip -DestinationPath xraysrc

          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile sb.zip
          $h = (Get-FileHash sb.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df") { throw "sing-box zip checksum mismatch: $h" }
          Expand-Archive sb.zip -DestinationPath sbsrc

          # Cores go under windows/cores-bin/cores/ — a Gradle resources srcDir —
          # so they end up INSIDE the app jar; the app extracts them on first
          # connect. This ships with both the MSI and the portable zip.
          New-Item -ItemType Directory -Force -Path windows/cores-bin/cores | Out-Null
          $dst = "windows/cores-bin/cores"
          Copy-Item xraysrc/xray.exe    $dst/
          Copy-Item xraysrc/geoip.dat   $dst/
          Copy-Item xraysrc/geosite.dat $dst/
          Copy-Item xraysrc/wintun.dll  $dst/
          Copy-Item sbsrc/sing-box-1.14.4-windows-amd64/sing-box.exe $dst/
          # size manifest the app uses to detect partial/stale extractions
          Get-ChildItem $dst | Where-Object { $_.Name -ne "manifest.txt" } |
            ForEach-Object { "$($_.Name):$($_.Length)" } | Set-Content "$dst/manifest.txt"
          Get-Content "$dst/manifest.txt"
          Get-ChildItem $dst | Format-Table Name, Length

      - name: Unit tests (the license & shard QA gate)
        working-directory: windows
        run: .\gradlew.bat test --no-daemon

      - name: Build (MSI + distributable app image)
        shell: pwsh
        working-directory: windows
        env:
          BEE_LICENSE_URL: ${{ secrets.BEE_LICENSE_URL }}
          BEE_LICENSE_PUBKEY_B64: ${{ secrets.BEE_LICENSE_PUBKEY_B64 }}
          BEE_TELEGRAM_URL: ${{ secrets.BEE_TELEGRAM_URL }}
          BEE_SUPPORT_URL: ${{ secrets.BEE_SUPPORT_URL }}
        run: |
          .\gradlew.bat packageMsi createDistributable --no-daemon

      # ── Portable zip: the self-contained app image + launcher ────────────
      - name: Assemble portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "windows/build/compose/binaries/main/app/BEE-VPN"
          Get-ChildItem $app | Format-Table Name, Length
          # cores ride INSIDE the app jars (extracted on first connect) —
          # scan every jar: the main jar is content-hashed, not a fixed name.
          $found = $false
          Get-ChildItem "$app/app" -Filter "*.jar" | ForEach-Object {
            if (-not $found) {
              $hits = jar tf $_.FullName | Select-String "cores/xray.exe"
              if ($hits) { $found = $true; Write-Host "cores present in $($_.Name)" }
            }
          }
          if (-not $found) { throw "cores did not land inside the app jar" }
          Copy-Item windows/BEE-VPN.bat "$app/BEE-VPN.bat"
          Copy-Item windows/README-FA.txt "$app/README-FA.txt"
          Compress-Archive -Path $app -DestinationPath BEE-VPN-1.1.0-portable-x64.zip

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: BEE-VPN-1.1.0-msi-x64
          path: windows/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: BEE-VPN-1.1.0-portable-x64
          path: BEE-VPN-1.1.0-portable-x64.zip
          if-no-files-found: error

      # Tag builds land on the GitHub Release next to the signed APKs
      # (release.yml) — one release, all three platforms.
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/build/compose/binaries/main/msi/*.msi
            BEE-VPN-1.1.0-portable-x64.zip
