name: Build Android APK

on:
  push:
    branches: [ master, shard-rewrite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # aether/Compose/KGP request a JDK 21 toolchain. foojay (the resolver
      # Gradle downloads JDKs from) no longer lists Temurin or JetBrains for 21
      # — its redirect answers 400 — so it cannot fetch one. Install 21 here
      # and let Gradle's auto-detect find it instead of downloading.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.3.11579264 cmake;3.22.1"
          accept-android-sdk-licenses: "true"

      - name: Install Rust and targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup signing keystore
        env:
          AETHERY_KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          echo "$AETHERY_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.env <<EOF
          storePassword=$AETHERY_KEYSTORE_PASSWORD
          keyAlias=$AETHERY_KEY_ALIAS
          keyPassword=$AETHERY_KEY_PASSWORD
          EOF

      - name: Build hev-socks5-tunnel (ndk-build)
        run: |
          set -e
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          if [ -d app/src/main/cpp/hev ]; then
            $NDK/ndk-build -C app/src/main/cpp/hev NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk -j$(nproc)
            echo "hev libs:"; ls -lh app/src/main/cpp/hev/libs/*/* 2>/dev/null || true
            for abi in arm64-v8a armeabi-v7a x86_64; do src="app/src/main/cpp/hev/libs/$abi/libhev-socks5-tunnel.so"; dst="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"; if [ -f "$src" ]; then mkdir -p "app/src/main/jniLibs/$abi"; cp "$src" "$dst"; echo "vendored hev $abi $(stat -c%s "$dst") bytes"; else echo "WARN: hev $abi not built"; fi; done
          else
            echo "hev source not present - skipping (legacy engine only)"
          fi

      - name: Generate Tor GeoIP assets (filtered per tools/filter-geoip.py)
        run: |
          # ExitNodes {cc} is dead without a GeoIP database: Tor cannot map a
          # country to relays, the candidate set comes out empty and bootstrap
          # stalls at 45-50%. The .gitignore keeps these derived files out of
          # git on purpose - they are regenerated here on every build from the
          # checksum-pinned Tor tarball (same pin as tor-binaries.yml), then
          # filtered down to the countries TorRegions.kt actually offers:
          # 9.5 MB -> ~6.4 MB on disk, ~1.8 MB inside the APK.
          set -euo pipefail
          TOR_VERSION=0.4.9.11
          EXPECTED=2e6c1720118c812acf0079fd47cf91b6bfaba5d766c321c4d3d2a28d6a11a8ed
          curl -fsSL --retry 3 -o /tmp/tor.tar.gz "https://dist.torproject.org/tor-$TOR_VERSION.tar.gz"
          echo "$EXPECTED  /tmp/tor.tar.gz" | sha256sum -c -
          mkdir -p /tmp/torgeoip
          tar -xzf /tmp/tor.tar.gz -C /tmp/torgeoip "tor-$TOR_VERSION/src/config/geoip" "tor-$TOR_VERSION/src/config/geoip6"
          python3 tools/filter-geoip.py "/tmp/torgeoip/tor-$TOR_VERSION/src/config/geoip" app/src/main/java/com/msnguard/vpn/TorRegions.kt app/src/main/assets
          ls -la app/src/main/assets/geoip app/src/main/assets/geoip6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
          BEE_IDENTITY_RELAY_HMAC: ${{ secrets.BEE_IDENTITY_RELAY_HMAC }}
          BEE_LICENSE_URL: ${{ secrets.BEE_LICENSE_URL }}
          BEE_TELEGRAM_URL: ${{ secrets.BEE_TELEGRAM_URL }}
          BEE_LICENSE_PUBKEY_B64: ${{ secrets.BEE_LICENSE_PUBKEY_B64 }}
          # foojay can no longer serve JDK 21, so stop Gradle trying to fetch
          # one and use the JDK installed above. auto-detect is Gradle's default.
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: 'false'
        run: |
          # The identity-relay HMAC is OPTIONAL for fork builds: without it the
          # APK builds fine, only relay-assisted identity provisioning is
          # disabled at runtime. Set the BEE_IDENTITY_RELAY_HMAC repo secret
          # once your own relay worker is deployed.
          test -n "$BEE_IDENTITY_RELAY_HMAC" || echo 'WARN: BEE_IDENTITY_RELAY_HMAC not set - relay-assisted identity provisioning will be disabled in this build' >&2
          # The subscription gate is OPTIONAL the same way: without these two
          # secrets the gate compiles to a pass-through (see license/LICENSE-SETUP-FA.txt).
          test -n "$BEE_LICENSE_URL" || echo 'WARN: BEE_LICENSE_URL not set - subscription gate will be disabled in this build' >&2
          test -n "$BEE_LICENSE_PUBKEY_B64" || echo 'WARN: BEE_LICENSE_PUBKEY_B64 not set - subscription gate will be disabled in this build' >&2
          # AGP's ABI splitter has been failing nondeterministically inside
          # IncrementalSplitterRunnable after compile/lint already passed.
          # Serialize packaging so split APK writers cannot race, and retain
          # the stacktrace if the packaging task itself fails again.
          ./gradlew --no-parallel --max-workers=1 --stacktrace assembleRelease -PaetheryKeystore=release.keystore

      - name: Verify APK signatures
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$SIGNER" verify --verbose --print-certs "$apk" > "$apk.signing.txt"
            cat "$apk.signing.txt"
            "$SIGNER" verify --verbose --print-certs --min-sdk-version 23 --max-sdk-version 23 "$apk" > "$apk.v1.txt"
            grep -q "Verified using v1 scheme.*: true" "$apk.v1.txt"
            cat "$apk.v1.txt"
            for scheme in 2 3; do
              grep -q "Verified using v$scheme scheme.*: true" "$apk.signing.txt"
            done
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk

      - name: Upload ARM64 APK only
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error