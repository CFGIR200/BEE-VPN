# BEE-VPN license server — Cloudflare Worker config
# Deploy:
#   npm install -g wrangler        (or: npx wrangler ...)
#   wrangler d1 create beevpn-license          # copy the id below
#   wrangler d1 execute beevpn-license --remote --file=schema.sql
#   wrangler deploy
# Secrets (one-time):
#   wrangler secret put LICENSE_ED25519_PRIV_B64   # from node keygen.mjs
name = "beevpn-license"
main = "license-worker.js"
compatibility_date = "2025-06-01"

[vars]
# Public by design: it ships inside the APK and is served by GET /pubkey.
# This IS the operator's real key — the matching private half lives only in
# the operator's offline copy + the LICENSE_ED25519_PRIV_B64 Worker secret.
LICENSE_ED25519_PUB_B64 = "S-H-4JCuQ3c_Asf4JDJTHoWLePvEQV14Bxcy7N2WORU"

[[d1_databases]]
binding = "DB"
database_name = "beevpn-license"
database_id = "abd67a5d-30d3-4669-8107-67684868b849"
